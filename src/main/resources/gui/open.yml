title: '&0公会列表'
size: 54
sound: ''

# 介绍信息
info:
  # 是否开启显示
  enable: true
  # 坐标
  index: 4
  # 显示内容
  name: '      &8[&e公会介绍&8]'
  # 显示物品材质
  material: PAINTING
  #是否附魔效果
  isEnchant: false
  # 自定义模型材质 1.14+生效 0为不生效
  custom-model-data: 0
  # 显示物品lore
  lore:
    - '&8▪ &7加入公会 共创世界'
    - '&8▪ &7贡献公会 公会商店'
    - '&8▪ &7雄鹰不为暴风折翼'
    - '&8▪ &7狼群不因长夜畏惧'
    - '&8▪ &7你不是一个人在战斗'

# 我的公会,没有公会的时候不会显示
me:
  enable: true
  index: 50
  name: '   &8[&e我的公会&8]'
  material: PLAYER_HEAD
  head: '${player}'
  isEnchant: false
  custom-model-data: 0
  lore:
    - '&f- &7查看我的公会'

# 创建公会提醒-没有公会时候显示 务必index值跟me的index保持一致
# 按钮显示权限 playerGuild.create 默认所有人拥有
create:
  enable: true
  index: 50
  name: '   &8[&e创建公会&8]'
  material: PLAYER_HEAD
  head: '${player}'
  isEnchant: false
  custom-model-data: 0
  lore:
    - '&f- &7点击创建公会'
  nameMsg: '&8[&a✔&8] &7请在聊天框输入&a公会名，&7输入 &aT &7退出操作'
  cancelMsh: '&8[&a✔&8] &7操作已取消'

# 公会lore列表支持内部变量列表
# 工会名:${guild_name} 活跃:${prosperity_degree} 会长:${guild_owner} 月度活跃:${month_prosperity_degree}
# 公会资金:${guild_money} 公会当前人数:${guild_member_count} 公会总人数:${guild_max_member_count}
# 公会创建时间:${guild_creation_time} 公会创建人:${guild_creator} 赛季排名:${guild_season_rank}
# 公会自定义描述:${description} 公会等级 ${guild_level}
# 支持解析papi变量，变量内容解析人为会长
guild:
  index: 20,21,22,23,24,29,30,31,32,33
  # 名称支持 公会等级${guild_level} 和 公会名称{guild_name}
  name: '             &8[&a${guild_name}&8]'
  isEnchant: false
  # 公会默认工具提示样式 1.21.2+生效
  tooltipStyle: ''
  # 自定义模型 1.21.2+
  itemModel: ''
  lore:
    - ''
    - '&f[ &c公会描述 &f]'
    - '&c>> &a${description}'
    - ''
    - '&8▪ &7公会会长 &e ${guild_owner}'
    - '&8▪ &7公会等级 &e ${guild_level}'
    - '&8▪ &7公会活跃 &e ${prosperity_degree}'
    - '&8▪ &7公会资金 &e ${guild_money}'
    - '&8▪ &7公会人数 &e ${guild_member_count} / ${guild_max_member_count}'
    - '&8▪ &7赛季排名 &e ${guild_season_rank}'
    - '&8▪ &7加入模式 &e ${join_mode}'
    - '&8▪ &7月度活跃 &e ${month_prosperity_degree}'
    - '&8▪ &7创建时间 &e ${guild_creation_time}'
    - '&a&m一一一一一一一一一一一一'
    - '        ${button}        '
    - '&a&m一一一一一一一一一一一一'

view: '&8▪ &7点击 &a查看'
noView: '&8▪ &7无权 &a操作'
join: '&8▪ &7点击 &a加入'
apply: '&8▪ &a申请加入中'

# 上一页
previousPage:
  enable: true
  index: 47
  name: '    &8[&a上一页&8]'
  lore:
    - '&8▪ &7点击打开上一页'
    - '&8▪ &7当前页码 &a${pageNum}'
    - '&8▪ &7总页码数 &a${count}'
  # 材质
  material: PAPER
  isEnchant: false
  custom-model-data: 0

# 下一页
nextPage:
  enable: true
  index: 51
  name: '    &8[&a下一页&8]'
  lore:
    - '&8▪ &7点击打开下一页'
    - '&8▪ &7当前页码 &a${pageNum}'
    - '&8▪ &7总页码数 &a${count}'
  # 材质
  material: PAPER
  isEnchant: false
  # 自定义模型材质 1.14+生效 0为不生效
  custom-model-data: 0

# 搜索
search:
  enable: true
  index: 48
  name: '    &8[&a根据类型搜索&8]'
  lore:
    - '&8▪ &7当前类型: &a${type}'
    - '&8▪ &7点击切换: &a${nextType}'
  # 材质
  material: COMPASS
  isEnchant: false
  custom-model-data: 0

# 自定义按钮 你可以在这无限扩展你想要的按钮，格式跟这个例子返回一样就好
custom:
  # 返回按钮
  back:
    enable: true
    index: 49
    name: '   &8[&a返回&8]'
    material: PLAYER_HEAD
    headBase: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNjllYTFkODYyNDdmNGFmMzUxZWQxODY2YmNhNmEzMDQwYTA2YzY4MTc3Yzc4ZTQyMzE2YTEwOThlNjBmYjdkMyJ9fX0='
    isEnchant: false
    lore:
      - '&f- &7点击返回'
    custom-model-data: 0
    # 执行的命令
    command: 'plm open menu'
  # 分隔板
  pane:
    enable: true
    index: 0,1,2,3,5,6,7,8,9,18,27,36,45,17,26,35,44,46,52,53
    material: black_stained_glass_pane
    isEnchant: false
    name: '        &8[&7分割板&8]'
    lore:
      - '&7哎呀,不要随便戳人家啦'
    custom-model-data: 0