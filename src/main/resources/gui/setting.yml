# gui标题
title: '&0公会管理'
size: 54
sound: ''

# 公会介绍
menu:
  enable: true
  index: 4
  isEnchant: false
  # 不自定义lore，会默认取公会自定义描述，如果你需要自定义这个节点
  # ${description} 为公会自定义描述变量，用法同open.yml的guild.lore中
  lore: []

# 升级
up:
  enable: true
  index: 20
  name: '      &8[&a公会升级&8]'
  material: BEACON
  isEnchant: true
  lore:
    - ''
    - '&f- &7点击进行公会升级'
    - ''
    - '&8▪ &7公会当前等级 &a#${level} &7级'
    - '&8▪ &7升级需要 &a${upMoney} &7资金'
    - '&8▪ &7当前拥有 &a${guildMoney} &7资金'
    - '&8▪ &7升级需要 &a${upProsperityDegree} &7活跃'
    - '&8▪ &7当前拥有 &a${guildProsperityDegree} &7活跃'
    - '&8▪ &7升级需要 &a${upMember} &7玩家'
    - '&8▪ &7当前拥有 &a${guildMember} &7玩家'
    - '&8▪ &7当前每日维护需&a${maintenanceMoney}*人数&7资金和&a${maintenanceActive}*人数&7活跃'
    - '&8▪ &7升级后每日维护需&a${upMaintenanceMoney}*人数&7资金和&a${upMaintenanceActive}*人数&7活跃'
    - ''
    - '${button}'
  custom-model-data: 0
  yesButton: ' &8[&a✔&8] &7点击进行升级'
  noButton: ' &8[&c✘&8] &7升级条件不满足'
  maxLevel: '&8[&c✘&8] &7公会已满级'

# 改名
editName:
  enable: true
  index: 21
  isEnchant: false
  name: '      &8[&a公会改名&8]'
  material: OAK_SIGN
  lore:
    - ''
    - '&f- &7点击修改公会名称'
    - ''
    - '&8▪ &7需要支付 &a${price} &7资金'
    - '&8▪ &7当前拥有 &a${guildMoney} &7资金'
    - ''
    - '${button}'
  custom-model-data: 0
  # 需要公会资金
  price: 1000
  yesButton: ' &8[&a✔&8] &7点击修改公会名'
  okButton: ' &8[&a✔&8] &7修改公会名成功，新名称: ${guildName}'
  noButton: ' &8[&c✘&8] &7没有足够资金操作'

# 邀请成员
invitation:
  enable: true
  index: 22
  name: '     &8[&a邀请成员&8]'
  material: PLAYER_HEAD
  isEnchant: false
  lore:
    - '&f- &7点击可邀请在线玩家加入'
  custom-model-data: 0

# logo商城
logoShop:
  enable: true
  index: 23
  name: '     &8[&a公会LOGO商城&8]'
  material: CHEST
  isEnchant: false
  lore:
    - '&f- &7点击前往公会logo商城'
  custom-model-data: 0

# logo仓库
logoWarehouse:
  enable: true
  index: 24
  name: '     &8[&a公会LOGO仓库&8]'
  material: ENDER_CHEST
  isEnchant: false
  lore:
    - '&f- &7点击查看公会已有LOGO'
  custom-model-data: 0

# 审批
apply:
  enable: true
  index: 29
  name: '     &8[&a公会审批&8]'
  material: REDSTONE_TORCH
  isEnchant: false
  lore:
    - '&f- &7点击查看申请列表'
  custom-model-data: 0

# 主城
setSpawn:
  enable: true
  index: 30
  name: '   &8[&a设置公会主城&8]'
  material: CLOCK
  isEnchant: false
  lore:
    - ''
    - '&8▪ &7当前主城位置'
    - ''
    - '&8▪ &7世界: &a${world}'
    - '&8▪ &7X: &a${x}'
    - '&8▪ &7Y: &a${y}'
    - '&8▪ &7Z: &a${z}'
    - ''
    - ' &8[&a✔&8] &7点击更改主城位置'
  custom-model-data: 0
  # 禁止设置主城的世界
  noWorld:
    - 'notWorld'

# pvp管理
pvp:
  enable: true
  index: 31
  name: '   &8[&a设置成员PVP&8]'
  material: iron_sword
  isEnchant: false
  lore:
    - ''
    - '&8▪ &7当前状态 &8[${pvpStatus}&8]'
    - ''
    - '&8▪ &7需支付 &a${price} &7公会资金'
    - '&8▪ &7你拥有 &a${money} &7公会资金'
    - ''
    - ' &8[&a✔&8] &7点击切换'
  custom-model-data: 0
  price: 100
  yesPvp: '&a开启PVP'
  noPvp: '&c禁止PVP'
  # pvp管理不会生效的世界
  noWorld: [ ]
  # 创建公会后默认的pvp状态
  default: true

# 创建公会基地
createGuildWorld:
  enable: true
  index: 39
  name: '    &8[&a创建公会基地&8]'
  material: END_PORTAL_FRAME
  isEnchant: false
  lore:
    - ''
    - '&8▪ 会长有权限创建'
    - ''
    - '${button}'
  custom-model-data: 0
  createButton: '&f- &7点击创建公会世界'
  haveButton: ' &f- &7你已拥有公会世界'
  # 公会世界名前缀,留空或者去掉 / 表示创建的世界没有文件夹(用来兼容一些特殊版本)
  format: 'world_guild/'

# 传送基地 index请保持和createGuildWorld节点一致
tpGuildWorld:
  enable: true
  index: 39
  name: '   &8[&a回到公会世界&8]'
  material: END_PORTAL_FRAME
  isEnchant: false
  lore:
    - '&f- &7点击回到公会世界'
  custom-model-data: 0

# 解散
dissolution:
  enable: true
  index: 33
  name: '   &8[&4解散公会&8]'
  material: GUNPOWDER
  isEnchant: false
  lore:
    - '&f- &7点击解散公会'
  custom-model-data: 0

# 变更描述
description:
  enable: true
  index: 38
  name: '   &8[&a变更描述&8]'
  material: OAK_SIGN
  isEnchant: false
  lore:
    - ''
    - '&f- &7点击修改公会描述'
    - ''
    - '&7▪ 当前描述'
    - '&c>> &a${description}'
    - ''
    - '&8▪ &7需要支付 &a${price} &7资金'
    - '&8▪ &7当前拥有 &a${guildMoney} &7资金'
    - ''
    - '${button}'
  custom-model-data: 0
  # 需要公会资金
  price: 1000
  # 最大多少字 英文逗号,自动换行
  maxFont: 48
  # 每行最大多少字
  maxLine: 16
  yesButton: ' &8[&a✔&8] &7点击修改公会描述'
  okButton: '&8[&a✔&8] &7修改公会描述成功'
  noButton: ' &8[&c✘&8] &7没有足够资金操作'
  changDescription: '&8[&a✔&8] &7请在聊天框输入&a公会描述 &7使用英文 &a, &7换行 &7输入 &aT &7退出操作(不返还扣除资金)'

# 加入模式
joinMode:
  enable: true
  index: 32
  name: '   &8[&a设置加入模式&8]'
  material: iron_sword
  isEnchant: false
  lore:
    - ''
    - '&8▪ &7当前状态 &8[${joinStatus}&8]'
    - ''
    - '&8▪ &7需支付 &a${price} &7公会资金'
    - '&8▪ &7你拥有 &a${money} &7公会资金'
    - ''
    - ' &8[&a✔&8] &7点击切换'
  custom-model-data: 0
  price: 100
  apply: '&a会长审批'
  auto: '&a自动审批'

# 返回按钮
back:
  enable: true
  index: 49
  name: '   &8[&a返回&8]'
  material: PLAYER_HEAD
  headBase: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNjllYTFkODYyNDdmNGFmMzUxZWQxODY2YmNhNmEzMDQwYTA2YzY4MTc3Yzc4ZTQyMzE2YTEwOThlNjBmYjdkMyJ9fX0='
  isEnchant: false
  lore:
    - '&f- &7点击返回'
  custom-model-data: 0

# 分隔板
pane:
  enable: true
  index: 0,1,2,3,5,6,7,8,9,18,27,36,45,17,26,35,44,53,46,47,48,50,51,52
  material: BLACK_STAINED_GLASS_PANE
  isEnchant: false
  name: '        &8[&7分割板&8]'
