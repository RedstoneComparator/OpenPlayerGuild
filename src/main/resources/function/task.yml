      - ''
      - '&f[ &c任务目标 &f]'
      - ''
      - '&c>> &a${taskSchedule}'
      - ''
      - '&f[ &c任务奖励 &f]'
      - ''
      - '&c>> &a公会资金 -> 1000'
      - '&c>> &a公会活跃 -> 1000'
      - '&c>> &a公会矿石 -> 1000'
      - ''
      - '${status}'
    reward:
      guildMoney: 1000
      guildProsperityDegree: 1000
      guildOre: 1000

# 每周日晚上23:00发奖励
rewardMsg: '&8[&a✔&8] &7公会任务${taskName}&7结算，奖励公会资金:&a${guildMoney}&7,公会活跃:&a${guildProsperityDegree}&7,公会矿石:&a${guildOre}'
# 每周一早上01:00刷新任务
refreshMsg: '&8[&a✔&8] &7本周公会任务刷新了，为了公会肝起来吧!'

unfinished: '&8[&c✘&8] &7任务未完成'
pendingSettlement: '&8[&a✔&8] &a已完成，等待星期${day} ${time}结算'
settled: '&8[&a✔&8] &a奖励已发放'

# 不建议更改该值,只用来测试奖励时候修改
# 公会任务结算星期，1-7
startDate: 7
# 公会任务结算时间,24小时制
startTime: '23:00'

# 介绍按钮
info:
  # 是否开启显示
  enable: true
  # 坐标
  index: 4
  # 显示内容
  name: '      &8[&e任务介绍&8]'
  # 显示物品材质
  material: PAINTING
  #是否附魔效果
  isEnchant: false
  # 自定义模型材质 1.14+生效 0为不生效
  custom-model-data: 0
  # 显示物品lore
  lore:
    - '&8▪ &7任务每周末&a23:00&7结算'
    - '&8▪ &7次日凌晨&a1:00&7刷新任务'
    - '&8▪ &7任务为公会全员一起完成'

