# 公会任务需要前置插件 PlayerTask
title: '&0公会任务'
size: 54

# 是否启用 true开启，false关闭
enable: true

# 是否刷新 群组服 mysql模式下 请只在一个主服里设置为true 避免重复刷新
refresh: true

# 是否自动发奖 true开启，false关闭
# 开启后公会任务完成时立即结算奖励
autoReward: false

# 显示的GUI位置
index: 20,21,22,23,24,29,30,31,32,33

# plk的任务id，这些任务会被添加到公会每周集体任务中
# 初始化0为不使用 如果要使用自己改
# 只会使用plk的任务目标和进度系统，奖励系统为公会插件自己发
# 先创建任务，后创建公会，如何顺序反了请用指令/plg refresh 刷新出来 公会已有过任务不会在被刷新
taskId:
  - 0
  - 0
  - 0
  - 0
  - 0

# 每个任务的信息单独展示配置 taskId要跟上面对应
guildTask:
  # taskId
  1:
    # 材质
    material: PAPER
    # 公会任务名称
    name: '&a公会任务 * ${taskName}'
    # 自定义模型材质 1.14+生效 0为不生效
    custom-model-data: 0
    # 公会任务lore ${taskSchedule} 为任务进度
    lore:
      - ''
      - '&f[ &c任务目标 &f]'
      - ''
      - '&c>> &a${taskSchedule}'
      - ''
      - '&f[ &c任务奖励 &f]'
      - ''
      - '&c>> &a公会资金 -> 1000'
      - '&c>> &a公会活跃 -> 1000'
      - '&c>> &a公会矿石 -> 1000'
      - ''
      - '${status}'
    reward:
      # 公会资金
      guildMoney: 1000
      # 公会活跃
      guildProsperityDegree: 1000
      # 公会矿石
      guildOre: 1000
  2:
    material: PAPER
    name: '&a公会任务 * ${taskName}'
    custom-model-data: 0
    lore:
      - ''
      - '&f[ &c任务目标 &f]'
      - ''
      - '&c>> &a${taskSchedule}'
      - ''
      - '&f[ &c任务奖励 &f]'
      - ''
      - '&c>> &a公会资金 -> 1000'
      - '&c>> &a公会活跃 -> 1000'
      - '&c>> &a公会矿石 -> 1000'
      - ''
      - '${status}'
    reward:
      guildMoney: 1000
      guildProsperityDegree: 1000
      guildOre: 1000
  3:
    material: PAPER
    name: '&a公会任务 * ${taskName}'
    custom-model-data: 0
    lore:
      - ''
      - '&f[ &c任务目标 &f]'
      - ''
      - '&c>> &a${taskSchedule}'
      - ''
      - '&f[ &c任务奖励 &f]'
      - ''
      - '&c>> &a公会资金 -> 1000'
      - '&c>> &a公会活跃 -> 1000'
      - '&c>> &a公会矿石 -> 1000'
      - ''
      - '${status}'
    reward:
      guildMoney: 1000
      guildProsperityDegree: 1000
      guildOre: 1000
  4:
    material: PAPER
    name: '&a公会任务 * ${taskName}'
    custom-model-data: 0
    lore:
      - ''
      - '&f[ &c任务目标 &f]'
      - ''
      - '&c>> &a${taskSchedule}'
      - ''
      - '&f[ &c任务奖励 &f]'
      - ''
      - '&c>> &a公会资金 -> 1000'
      - '&c>> &a公会活跃 -> 1000'
      - '&c>> &a公会矿石 -> 1000'
      - ''
      - '${status}'
    reward:
      guildMoney: 1000
      guildProsperityDegree: 1000
      guildOre: 1000
  5:
    material: PAPER
    name: '&a公会任务 * ${taskName}'
    custom-model-data: 0
