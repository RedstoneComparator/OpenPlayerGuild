# 公会称号需要前置插件 PlayerTitle
title: '&0公会称号'
size: 27

# 是否启用 true开启，false关闭
enable: true

# buff类型 目前只支持 attribute_plus 或 sx_attribute 或 AttributeSystem 或 MythicLib
buffType: 'attribute_plus'
# 称号描述
description:
  - '&a ${guild_name} &7公会专属称号'

# 称号应用类型 wear:佩戴 collect:收集
applyType: 'wear'

# 公会称号设置 1:为等级，可以按照顺序无限扩展
1:
  # 称号名称
  title: '&f[ &7${guild_name}%playerGuild_role% &f]'
  # buff属性配置
  buff: []
  # 显示配置 有配置display根据display显示，没有配置根据buff显示
  # 如果要配置，请务必配置的跟buff行数一致! PlayerTitle 3.5.3+支持display
  display: []
2:
  title: '&f[ &a${guild_name}%playerGuild_role% &f]'
  buff: []
3:
  title: '&f[ &e${guild_name}%playerGuild_role% &f]'
  buff: []
4:
  title: '&f[ &e${guild_name}%playerGuild_role% &f]'
  buff: []
