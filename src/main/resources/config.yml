# 本插件gui语言排版出自小羊咩咩～

# 跨服传送标识-每个服必须跟bc里配置的一样(BC服必须先配置完这个,才能跨服)
serverName: 'server'

# 公会默认logo
defaultLogo: APPLE
# spawn传送延迟时间(单位秒)
delayTime: 3
# spawn传送等待时间(单位秒)
waitTime: 3

# 离开公会后重新加入公会的冷却时间 单位 小时
joinCooling: 3

# 没有公会玩家登录后进行提醒
noGuildRemind: true

# 申请加入公会变量判断 玩家申请/会长邀请加入,判断该变量是否跟会长一致判断
joinPapi: ''

# 没公会时候显示名
default: '&7无公会'
# 公会变量 %playerGuild_show_name% 默认前缀
prefixBrackets: '&f['
# 公会变量 %playerGuild_show_name% 默认后缀
suffixBrackets: '&f]'

# 是否开启加载公会成员头颅
setHead: true
# 是否开启open中默认公会logo头颅加载会长皮肤
setDefaultHead: true

# open指令默认排序字段 填错或不填则使用 prosperity_degree
# prosperity_degree        公会活跃
# level                    公会等级
# money                    公会资金
# create_time              创建时间
# member_count             公会人数
# month_prosperity_degree  月度活跃
openDefaultSort: 'prosperity_degree'

# 公会战结束模式 default:回到玩家比赛开始前位置 lookLocation:回到观站点 spawn:回到主城
# 不填上面三种类型 例如: pvpEndModel: "suicide" 效果是玩家执行这个 suicide 指令
pvpEndModel: 'default'

# 每日全量备份数据到backUp目录
backUp: false
# 备份时间
backUpTime: '00:00'

# 离开公会后依然保留玩家公会数据
levelSavePlayerData: false

# 是否开启离线玩家数据缓存
isOfflinePapiCache: true

# 是否开启公会月度活跃清理,群组服 MYSQL 情况下只在一个服开启
monthClear: true

# 语言文件 [可选 中文简体:zh_CN]
# 第一次修改语言文件,需重启生效
language: zh_CN

